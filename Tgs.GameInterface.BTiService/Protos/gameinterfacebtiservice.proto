syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.BTiService.Protos";

package GameInterfaceBTiService;

// The greeting service definition.
service  GameInterfaceBTiService{
  // Sends a greeting
  rpc CreatePlayer (CreatePlayerRequest) returns (Reply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOrderChecking(FundOrderCheckingRequest) returns (FundOrderCheckingReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc GetBalance (BalanceRequest) returns (BalanceReply);  
  rpc GetGamePullRecord (GamePullRecordRequest) returns (GamePullRecordReply);
}

// The request message containing the user's name.
message FundRequest {
	string api_url = 1;
	string agent_user_name = 2;
	string agent_password = 3;
	string player_code = 4;
	string transaction_id = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundOrderCheckingRequest {
	string api_url = 1;
	string agent_user_name = 2;
	string agent_password = 3;
	string transaction_id = 4;
}

message BalanceRequest {
	string api_url = 1;
	string agent_user_name = 2;
	string agent_password = 3;
	string player_code = 4;
}

message KickPlayerRequest {
	string api_url = 1;
	string agent_user_name = 2;
	string agent_password = 3;
	string player_code = 4;
}

message CreatePlayerRequest {
	string api_url = 1;
	string agent_user_name = 2;
	string agent_password = 3;
	string brand = 4;
	string player_code = 5;
	string currency = 6;
}

message GamePullRecordRequest {
	string api_url = 1;
	string agent_user_name = 2;
	string agent_password = 3;
	google.protobuf.Timestamp start_time = 4; 
	google.protobuf.Timestamp end_time = 5;
	int32 page = 6;
	int32 page_limit = 7;
}

// The response message containing the greetings.
message Reply {
	bool success = 1;
}

message FundReply {
	string transaction_id = 1;	
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundOrderCheckingReply {
	bool exist = 1;
}

message BalanceReply {
	bool success = 1;
	string message = 2;
	bool is_player_exist = 3;
	phoenix.protobuf.DecimalValue balance = 4;
}

message GamePullRecordReply {
	repeated GamePullRecord items = 1;
}

message GamePullRecord {
	
}
